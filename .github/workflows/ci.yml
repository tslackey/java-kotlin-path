name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  solutions:
    name: Reference solutions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Test reference solutions
        run: ./gradlew test -Psolutions --no-daemon
